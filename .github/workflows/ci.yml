name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Set up MinGW for CGO
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63 # v3
        with:
          platform: x64

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  python:
    name: Python MCP server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: whatsapp-mcp-server/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Compile Python sources
        run: >-
          uv run python -m py_compile
          main.py whatsapp.py macos_contacts.py audio.py outbound_confirmation.py transcription.py
          ../scripts/run_bridge.py
          ../scripts/install_macos_launch_agent.py
          ../scripts/verify_macos_profile.py

      - name: Test
        run: uv run python -m unittest discover -s tests -v

      - name: Verify optional Whisper dependency
        run: uv run --extra whisper python -c "import faster_whisper"

  macos-contacts:
    name: macOS Contacts helper
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile native helper
        run: >-
          xcrun swiftc
          whatsapp-mcp-server/macos-contacts-helper/main.swift
          -framework Contacts
          -o "$RUNNER_TEMP/WhatsAppMCPContacts"
