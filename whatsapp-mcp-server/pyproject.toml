[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "Local WhatsApp bridge and MCP tools with optional Whisper transcription"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.2.1,<2",
]

[tool.uv]
package = false
